name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest
            build-target: apk
          - os: windows-2022
            label: windows-2022
            build-target: windows
          - os: ubuntu-latest
            label: ubuntu-latest, minimum SDK
            flutter-version: 3.47.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read Flutter stable version
        shell: bash
        run: echo "FLUTTER_STABLE_VERSION=$(tr -d '\r\n' < .github/flutter-version)" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter-version || env.FLUTTER_STABLE_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --reporter expanded

      - name: Set up Java
        if: matrix.build-target == 'apk'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android example
        if: matrix.build-target == 'apk'
        run: flutter build apk --release --no-pub --target-platform android-arm64
        working-directory: example

      - name: Build Windows example
        if: matrix.build-target == 'windows'
        run: flutter build windows --release --no-pub
        working-directory: example
