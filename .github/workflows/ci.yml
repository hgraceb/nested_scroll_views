name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ubuntu-latest
            flutter-version: 3.47.8
          - os: windows-2022
            label: windows-2022
            flutter-version: 3.47.8
          - os: ubuntu-latest
            label: ubuntu-latest, minimum SDK
            flutter-version: 3.47.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Verify copied sources
        if: matrix.flutter-version == '3.47.8'
        run: |
          dart pub cache add material_ui --version 1.8.0
          dart tool/check_flutter_sources.dart "${{ env.FLUTTER_ROOT }}" "${{ env.PUB_CACHE }}/hosted/pub.dev/material_ui-1.8.0"

      - name: Build Windows example
        if: runner.os == 'Windows'
        run: flutter build windows --debug
        working-directory: example

      - name: Build example assets
        if: runner.os != 'Windows'
        run: flutter build bundle --debug
        working-directory: example

      - name: Test
        run: flutter test --no-pub --reporter expanded

      - name: Test example assets
        working-directory: example
        env:
          EXAMPLE_ASSET_DIR: ${{ runner.os == 'Windows' && 'build/windows/x64/runner/Debug/data/flutter_assets' || 'build/flutter_assets' }}
        run: flutter test --no-pub --reporter expanded
