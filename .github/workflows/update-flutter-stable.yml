name: Update Flutter stable

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-flutter-stable
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_BRANCH: automation/flutter-stable
    steps:
      - name: Verify update token
        id: update-token
        env:
          GH_TOKEN: ${{ secrets.FLUTTER_UPDATE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::error::Add the FLUTTER_UPDATE_TOKEN repository secret before running this workflow.'
            exit 1
          fi
          login="$(gh api user --jq .login)"
          echo "login=$login" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch latest Flutter stable version
        id: stable
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from 'node:fs/promises';

          const response = await fetch(
            'https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json',
            { signal: AbortSignal.timeout(30_000) },
          );
          if (!response.ok) {
            throw new Error(`Flutter release lookup failed: ${response.status}`);
          }
          const data = await response.json();
          const release = data.releases.find(
            ({ hash, channel }) => hash === data.current_release.stable && channel === 'stable',
          );
          if (!release || !/^\d+\.\d+\.\d+$/.test(release.version)) {
            throw new Error('The Flutter release manifest has no valid current stable version.');
          }
          await writeFile('.github/flutter-version', `${release.version}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `version=${release.version}\n`);
          NODE

      - name: Create or update Flutter stable pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.FLUTTER_UPDATE_TOKEN }}
          branch: ${{ env.UPDATE_BRANCH }}
          add-paths: .github/flutter-version
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'ci: update Flutter stable to ${{ steps.stable.outputs.version }}'
          title: 'ci: update Flutter stable to ${{ steps.stable.outputs.version }}'
          body: |
            Update the Flutter stable SDK tested by CI to `${{ steps.stable.outputs.version }}`.

            CI checks analysis, tests, and the Android and Windows release examples, as well as the minimum supported SDK. This version-only update is merged automatically after all checks pass.

      - name: Enable auto-merge for the Flutter stable update
        if: >-
          steps.pull-request.outputs.pull-request-number != '' &&
          steps.pull-request.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.FLUTTER_UPDATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_AUTHOR: ${{ steps.update-token.outputs.login }}
          UPDATE_PR: ${{ steps.pull-request.outputs.pull-request-number }}
          UPDATE_HEAD_SHA: ${{ steps.pull-request.outputs.pull-request-head-sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8' });
          const repository = process.env.GH_REPO;
          const pull = JSON.parse(gh(
            'api', `repos/${repository}/pulls/${process.env.UPDATE_PR}`,
          ));
          if (
            pull.state !== 'open' || pull.draft ||
            pull.user.login !== process.env.UPDATE_AUTHOR ||
            pull.base.ref !== process.env.DEFAULT_BRANCH ||
            pull.base.repo.full_name !== repository ||
            pull.head.ref !== process.env.UPDATE_BRANCH ||
            pull.head.repo?.full_name !== repository ||
            pull.head.sha !== process.env.UPDATE_HEAD_SHA
          ) {
            console.log('The pull request no longer matches the generated Flutter update.');
            process.exit(0);
          }
          const files = JSON.parse(gh('api', `repos/${repository}/pulls/${pull.number}/files`));
          if (pull.changed_files !== 1 || files.length !== 1 || files[0].filename !== '.github/flutter-version' || files[0].status !== 'modified') {
            console.log('The pull request needs manual review because it changes more than the Flutter version.');
            process.exit(0);
          }
          process.stdout.write(gh(
            'pr', 'merge', String(pull.number), '--auto', '--squash',
            '--match-head-commit', process.env.UPDATE_HEAD_SHA,
          ));
          NODE
