name: Update Flutter stable

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [automation/flutter-stable]

permissions:
  contents: read

concurrency:
  group: update-flutter-stable
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      UPDATE_BRANCH: automation/flutter-stable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch latest Flutter stable version
        id: stable
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, writeFile } from 'node:fs/promises';

          const response = await fetch(
            'https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json',
            { signal: AbortSignal.timeout(30_000) },
          );
          if (!response.ok) {
            throw new Error(`Flutter release lookup failed: ${response.status}`);
          }
          const data = await response.json();
          const release = data.releases.find(
            ({ hash, channel }) => hash === data.current_release.stable && channel === 'stable',
          );
          if (!release || !/^\d+\.\d+\.\d+$/.test(release.version)) {
            throw new Error('The Flutter release manifest has no valid current stable version.');
          }
          await writeFile('.github/flutter-version', `${release.version}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `version=${release.version}\n`);
          NODE

      - name: Create or update Flutter stable pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: ${{ env.UPDATE_BRANCH }}
          add-paths: .github/flutter-version
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'ci: update Flutter stable to ${{ steps.stable.outputs.version }}'
          title: 'ci: update Flutter stable to ${{ steps.stable.outputs.version }}'
          body: |
            Update the Flutter stable SDK tested by CI to `${{ steps.stable.outputs.version }}`.

            CI checks analysis, tests, and the Android and Windows release examples, as well as the minimum supported SDK. This version-only update is merged automatically after all checks pass.

      - name: Run compatibility checks
        if: >-
          steps.pull-request.outputs.pull-request-number != '' &&
          steps.pull-request.outputs.pull-request-operation != 'closed' &&
          (github.event_name == 'workflow_dispatch' ||
          steps.pull-request.outputs.pull-request-operation == 'created' ||
          steps.pull-request.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$UPDATE_BRANCH"

  auto-merge:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the verified Flutter stable update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const gh = (...args) => execFileSync('gh', args, { encoding: 'utf8' });
          const repository = process.env.GH_REPO;
          const branch = 'automation/flutter-stable';
          const pulls = JSON.parse(gh(
            'api', '--method', 'GET', `repos/${repository}/pulls`,
            '-f', 'state=open',
            '-f', `base=${process.env.DEFAULT_BRANCH}`,
            '-f', `head=${repository.split('/')[0]}:${branch}`,
          ));
          const pull = pulls.find(pr =>
            pr.user.login === 'github-actions[bot]' &&
            pr.base.ref === process.env.DEFAULT_BRANCH &&
            pr.head.ref === branch &&
            pr.head.repo?.full_name === repository &&
            pr.head.sha === process.env.CI_HEAD_SHA,
          );
          if (!pull) {
            console.log('No open bot update matches the commit that passed CI.');
            process.exit(0);
          }
          const files = JSON.parse(gh('api', `repos/${repository}/pulls/${pull.number}/files`));
          if (files.length !== 1 || files[0].filename !== '.github/flutter-version' || files[0].status !== 'modified') {
            console.log('The pull request needs manual review because it changes more than the Flutter version.');
            process.exit(0);
          }
          process.stdout.write(gh(
            'pr', 'merge', String(pull.number), '--squash',
            '--match-head-commit', process.env.CI_HEAD_SHA,
          ));
          NODE
